<!DOCTYPE html>
<html>
<head>
    <title>Google Form Style</title>
    <style>
        body{
            background-image:linear-gradient(to right,purple,pink);
            font-family:Arial, sans-serif;
        }
        .container{
            width:400px;
            margin:50px auto;
        }
        .form-box{
            background:white;
            border-radius:10px;
            padding:20px;
        }
        .header{
            border-top:8px solid #673ab7;
            padding-top:10px;
        }
        h2{
            color:black;
        }
        input{
            width:100%;
            padding:10px;
            margin-top:5px;
            margin-bottom:15px;
            border:1px solid #ccc;
            border-radius:4px;
        }
        .form-box{
            box-shadow:0px 2px 8px rgba(0,0,0,0.2);
        }
        button{
            background:purple;
            color:white;
            border:none;
            padding:10px 20px;
            border-radius:5px;
            cursor:pointer;
        }
        button:hover{
            background:white;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="form-box">
        <div class="header">
            <h2>Student Registration Form</h2>
        </div>
        <form>
            <label>Full Name</label>
            <input type="text" placeholder="Enter your name">
            <label>Email</label>
            <input type="email" placeholder="Enter your email">
            <label>Phone Number</label>
            <input type="tel" placeholder="Enter your phone number">
            <label>Department</label>
            <input type="text" placeholder="Enter department">
            <button type="submit">Submit</button>
        </form>
    </div>
</div>
</body>
</html>
